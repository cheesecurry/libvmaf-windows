name: Build libvmaf

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-libvmaf.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout VMAF
        uses: actions/checkout@v4
        with:
          repository: Netflix/vmaf
          fetch-depth: 1

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja

      - name: Build libvmaf
        shell: msys2 {0}
        run: |
          mkdir -p /c/vmaf-install

          meson setup libvmaf libvmaf/build \
            --buildtype release \
            --default-library shared \
            --prefix /c/vmaf-install

          meson compile -C libvmaf/build

          meson install -C libvmaf/build

      - name: Show generated files
        shell: msys2 {0}
        run: |
          find /c/vmaf-install -type f

      - name: Upload libvmaf
        uses: actions/upload-artifact@v4
        with:
          name: libvmaf-windows-x64
          path: C:/vmaf-install/