name: Build latest libvmaf for Windows

on:
  workflow_dispatch:
  schedule:
    # 毎月1日 03:00 UTC = 日本時間 12:00
    - cron: "0 3 1 * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.check.outputs.build }}

    steps:
      - name: Get latest VMAF release
        id: version
        shell: bash
        run: |
          VERSION=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Netflix/vmaf/releases/latest \
            | jq -r '.tag_name')

          echo "Latest VMAF version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "${VERSION}-win-x64" >/dev/null 2>&1; then
            echo "Release already exists."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version detected."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout VMAF
        uses: actions/checkout@v4
        with:
          repository: Netflix/vmaf
          ref: ${{ needs.check.outputs.version }}
          fetch-depth: 1

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja

      - name: Build libvmaf
        shell: msys2 {0}
        run: |
          mkdir -p /c/vmaf-install

          meson setup libvmaf/build libvmaf \
            --buildtype release \
            --default-library shared \
            --prefix /c/vmaf-install \
            -Denable_tests=false \
            -Denable_docs=false

          meson compile -C libvmaf/build
          meson install -C libvmaf/build

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path package

          Copy-Item `
            "C:\vmaf-install\bin\*.dll" `
            "package\"

          Copy-Item `
            "LICENSE" `
            "package\LICENSE.txt"

          Compress-Archive `
            -Path "package\*" `
            -DestinationPath "libvmaf-win-x64.zip"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        shell: pwsh
        run: |
          $tag = "${VERSION}-win-x64"

          gh release create $tag `
            libvmaf-win-x64.zip `
            --title "libvmaf $VERSION - Windows x64" `
            --notes "Windows x64 build of Netflix/VMAF $VERSION."