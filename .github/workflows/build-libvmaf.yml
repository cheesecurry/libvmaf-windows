name: Build libvmaf for Windows x64

on:
  workflow_dispatch:
  schedule:
    # 毎月1日 03:00 UTC = 日本時間 12:00
    - cron: "0 3 1 * *"

permissions:
  contents: write

jobs:
  check:
    name: Check latest libvmaf release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.vmaf.outputs.version }}
      build: ${{ steps.check-release.outputs.build }}

    steps:
      - name: Get latest VMAF version
        id: vmaf
        shell: bash
        run: |
          VERSION=$(curl -fsSL \
            https://api.github.com/repos/Netflix/vmaf/releases/latest \
            | jq -r '.tag_name')

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Failed to get latest VMAF version."
            exit 1
          fi

          echo "Latest VMAF version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: check-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.vmaf.outputs.version }}
        shell: bash
        run: |
          TAG="${VERSION}-win-x64"

          echo "Checking release: $TAG"

          if gh release view "$TAG" \
              --repo "${{ github.repository }}" \
              >/dev/null 2>&1; then

            echo "Release already exists: $TAG"
            echo "build=false" >> "$GITHUB_OUTPUT"

          else

            echo "Release does not exist: $TAG"
            echo "build=true" >> "$GITHUB_OUTPUT"

          fi


  build:
    name: Build libvmaf
    needs: check

    if: needs.check.outputs.build == 'true'

    runs-on: windows-latest

    steps:
      - name: Checkout Netflix/vmaf
        uses: actions/checkout@v6
        with:
          repository: Netflix/vmaf
          ref: ${{ needs.check.outputs.version }}
          fetch-depth: 1

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            nasm
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja

      - name: Build libvmaf
        shell: msys2 {0}
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          echo "Building libvmaf ${VERSION}"

          meson setup libvmaf/build libvmaf \
            --buildtype release \
            --default-library shared \
            --prefix /c/vmaf-install \
            -Denable_tests=false \
            -Denable_docs=false

          meson compile -C libvmaf/build

          meson install -C libvmaf/build

      - name: Show installed files
        shell: bash
        run: |
          echo "Installed files:"
          find /c/vmaf-install -type f -print

      - name: Package DLL
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p package

          cp /c/vmaf-install/bin/*.dll package/

          cp libvmaf/LICENSE package/

          echo "Package contents:"
          ls -lah package

          cd package

          7z a "../libvmaf-win-x64.zip" *

      - name: Show package
        shell: bash
        run: |
          ls -lah libvmaf-win-x64.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        shell: bash
        run: |
          TAG="${VERSION}-win-x64"

          echo "VERSION=${VERSION}"
          echo "TAG=${TAG}"

          gh release create "${TAG}" \
            "libvmaf-win-x64.zip" \
            --repo "${{ github.repository }}" \
            --title "libvmaf ${VERSION} for Windows x64" \
            --notes "Windows x64 build of Netflix libvmaf ${VERSION}."